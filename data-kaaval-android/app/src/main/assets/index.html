<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Data Kaaval">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Data Kaaval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Tamil:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Summary ring first, ranked apps below, fixed 5-tab bar at the bottom. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surf-solid:#FFFFFF; --surface2:#E8EDF6; --line:#D3DBE9;
  --fg:#0D1424; --muted:#556278; --accent:#2F6BFF; --on-accent:#FFFFFF;
  --ok:#0E9F78; --warn:#B86E00; --over:#D6303F;
  --display:'Bricolage Grotesque','Noto Sans Tamil',system-ui,sans-serif;
  --body:'Manrope','Noto Sans Tamil',system-ui,sans-serif;
  --wt:700; --wth:800; --scale:1;
  --hfg:var(--fg); --hmuted:var(--muted); --bgimg:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1C; --surface:#121A2B; --surf-solid:#121A2B; --surface2:#1B2539; --line:#27334D;
    --fg:#EAF0FF; --muted:#8E9DBA; --accent:#5B9BFF; --on-accent:#06101F;
    --ok:#2DD4A7; --warn:#FBBF24; --over:#FF5D6C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#121A2B; --surf-solid:#121A2B; --surface2:#1B2539; --line:#27334D;
  --fg:#EAF0FF; --muted:#8E9DBA; --accent:#5B9BFF; --on-accent:#06101F;
  --ok:#2DD4A7; --warn:#FBBF24; --over:#FF5D6C; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--scale));background-color:var(--bg);background-image:var(--bgimg,none);background-attachment:fixed}
body{
  margin:0;background:transparent;color:var(--fg);
  font-family:var(--body);font-weight:var(--wt);font-size:1rem;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 104px;min-height:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{color:var(--hfg);display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;color:var(--accent)}
.date{font-size:.8rem;color:var(--hmuted);text-align:right}

/* text effects */
.fx{font-family:var(--display);font-weight:800;display:inline-block}
html[data-fx="shimmer"] .fx{
  background:linear-gradient(100deg,var(--fg),var(--accent),var(--fg));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shimmer 5s linear infinite;
}
@keyframes shimmer{to{background-position:-200% 0}}
html[data-fx="pulse"] .fx{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6;transform:scale(1.03)}}
html[data-fx="glow"] .fx{color:var(--accent);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}to{text-shadow:0 0 22px color-mix(in srgb,var(--accent) 80%,transparent)}}
html[data-save="1"] *,html[data-save="1"] *::before{animation:none!important;transition:none!important}
html[data-hidden="1"] *{animation-play-state:paused!important}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none!important;transition:none!important}}

/* view transition */
.view{display:flex;flex-direction:column;gap:14px}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}
.view.enter>*:nth-child(3){animation-delay:.1s}
.view.enter>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;min-width:0}
.card h2{font-family:var(--display);font-size:1.1rem;font-weight:var(--wth);margin-bottom:12px}
.sub{color:var(--muted);font-size:.82rem}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* hero */
.hero{display:grid;gap:14px;justify-items:center;padding:20px 16px 18px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 70%)}
.ringbox{position:relative;width:min(240px,68vw);aspect-ratio:1}
.ring{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:14}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring-fg.warn{stroke:var(--warn)}.ring-fg.over{stroke:var(--over)}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.big{font-size:2.7rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bigu{font-size:1rem;margin-left:4px;font-family:var(--display)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:.78rem;font-weight:800;
  background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.over{background:color-mix(in srgb,var(--over) 20%,transparent);color:var(--over)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:14px;min-height:44px;padding:0 16px;font-weight:800}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem;border-radius:12px}
.btn.danger{color:var(--over)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:40px;font-weight:800;color:var(--muted);min-width:0;padding:0 6px}
.seg button.on{background:var(--surf-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;font-size:.8rem;
  background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}

/* app rows */
.ico{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;font-family:var(--display);font-weight:800;flex:none}
.arow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0;padding-top:0}
.arow:last-child{padding-bottom:0}
.arow.in{animation:rise .4s both;animation-delay:calc(var(--i)*35ms)}
.atop{display:flex;align-items:center;gap:8px;min-width:0}
.aname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aval{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.asub{font-size:.74rem;color:var(--muted)}
.asub.warn{color:var(--warn)}.asub.over{color:var(--over)}

/* charts */
.chartwrap{position:relative;width:100%}
.donut{position:relative;width:min(210px,60vw);aspect-ratio:1;margin:0 auto 14px}
.donut svg{width:100%;height:100%;display:block}
.donut .ringc .big{font-size:1.9rem}
svg .axis{fill:var(--muted);font:700 9px var(--body)}
svg .grid{stroke:var(--line);stroke-width:1}
.tip{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:.88rem}
.hit{fill:transparent;cursor:pointer}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h2{margin:0;font-size:1.05rem}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:1.2rem;font-weight:800}
.iconbtn:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px}
.cell{aspect-ratio:1/1.1;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0;
  background:var(--surface2);font-weight:800}
.cell small{font-size:.58rem;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.cell.empty{visibility:hidden}
.cell:disabled{opacity:.4;cursor:default}
.cell.sel{border-color:var(--fg)}
.cell.today .d{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.wdbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:130px}
.wdbars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:.68rem;color:var(--muted)}
.wdbars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--surface2);min-height:6px}
.wdbars .hi i{background:var(--accent)}
.wdbars .hi{color:var(--fg)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=number],input[type=text],select{
  width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;min-width:0}
input[type=color]{width:46px;height:46px;border:0;padding:0;background:none;border-radius:14px;flex:none}
input[type=range]{width:100%;accent-color:var(--accent);min-height:30px}
.two{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:7px 14px;font-weight:800;font-size:.85rem;min-height:36px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.switch:first-of-type{border-top:0}
.tg{width:50px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .tg{background:var(--accent)}
.switch[aria-checked="true"] .tg::after{transform:translateX(20px);background:var(--on-accent)}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0;padding-top:0}
.lim{display:flex;align-items:center;gap:6px;width:130px;flex:none}
.lim input{min-height:42px;padding:0 10px}
.lim span{font-size:.75rem;color:var(--muted)}
.x{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;font-weight:800;flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--c);padding:0;position:relative}
.sw.on{outline:3px solid var(--fg);outline-offset:2px}
.sw.auto{background:conic-gradient(var(--fg),var(--accent),var(--fg))}
.sample{font-size:1.6rem;margin-top:6px}

/* hotspot + background swatches */
.hsnum{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.sw.sq{border-radius:12px;width:44px;height:44px}
.sw.g{background:linear-gradient(135deg,var(--c),var(--c2))}
.pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw.custom{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);color:#fff;font-weight:900;font-size:1.25rem;display:grid;place-items:center;text-shadow:0 1px 3px #000a}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-weight:var(--wt);text-align:left;font-size:.88rem}
.cdot{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);flex:none}
.pkr{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;margin:6px 0 14px;border:1px solid var(--line);outline:none}
.pkr::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #0009;box-shadow:0 1px 5px #0007}
.pkprev{height:64px;border-radius:18px;border:2px solid var(--line);margin:10px 0 14px}
.pkq{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pickrow span{font-size:.8rem;color:var(--muted)}

/* compact mode for Limits and Settings */
.cmp .card{padding:12px;border-radius:18px}
.cmp .card h2{font-size:.95rem;margin-bottom:8px}
.cmp .sub{font-size:.7rem}
.cmp .switch{padding:8px 0;font-size:.8rem}
.cmp .tg{width:42px;height:26px}.cmp .tg::after{width:18px;height:18px}
.cmp .switch[aria-checked="true"] .tg::after{transform:translateX(16px)}
.cmp .seg{padding:3px;border-radius:12px}.cmp .seg button{min-height:32px;font-size:.74rem;border-radius:9px}
.cmp .btn{min-height:34px;font-size:.76rem;padding:0 12px;border-radius:11px}
.cmp .lrow{padding:7px 0}.cmp .lrow b{font-size:.82rem}
.cmp .lbl,.cmp .field label{font-size:.64rem}
.cmp input[type=number],.cmp input[type=text],.cmp select{min-height:34px;font-size:.8rem;border-radius:10px;padding:0 10px}
.cmp .ico{width:30px;height:30px;border-radius:9px}
.cmp .aname{font-size:.84rem}
.cmp .chip{min-height:28px;padding:3px 10px;font-size:.74rem}
.cmp .lrow2{padding:7px 0;gap:6px}
.cmp .three{grid-template-columns:minmax(0,110px) auto auto;justify-content:start}
.cmp .three select{min-width:62px}
.cmp .three .btn{min-height:34px}
.cmp .pill{font-size:.68rem;padding:3px 9px}
.seeall{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:99px;padding:5px 16px;font-weight:800;font-size:.76rem}
/* app logos */
img.ico{object-fit:cover;background:var(--surface2)}

/* limit rows */
.lrow2{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.lrow2:first-child{border-top:0;padding-top:0}
.three{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.three select{width:auto;min-width:76px}
.three .btn{min-height:46px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf-solid);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.nav button{border:0;background:transparent;border-radius:14px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--navfg,var(--muted));font-size:.68rem;font-weight:800;padding:0;min-width:0}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheet, popup, toast */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(4,7,14,.62);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:560px;background:var(--surf-solid);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;animation:rise .3s both}
.sheet h2{font-family:var(--display);font-size:1.25rem;font-weight:800}
.pop-bg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg);
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow:auto}
.pop-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 25%,color-mix(in srgb,var(--pc) 38%,transparent),transparent 70%);pointer-events:none}
.pop{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.pop.warn{--pc:var(--warn)}.pop.over{--pc:var(--over)}
.pbadge{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.2rem;
  color:var(--pc);border:8px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.07)}}
.pop h2{font-size:2.1rem;line-height:1.1;font-family:var(--display);font-weight:800}
.pop p{color:var(--muted);font-size:1rem}
.pnum{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.pop .btn{width:100%}
#toast{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;font-size:.88rem;max-width:520px;animation:rise .25s both}
.toast.warn{background:var(--warn);color:#111}
.toast.over{background:var(--over);color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}

  var rnd=mulberry(20261101),days={},now=new Date();
  var frac=(now.getHours()*60+now.getMinutes())/1440;
  var sw=apps.reduce(function(a,b){return a+(b.w||5)},0);

    off+=len;return el;

/* ---------- alerts ---------- */
var popQ=[],popOpen=false;
function toast(msg,kind){
  var el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;$('#toast').appendChild(el);
  setTimeout(function(){el.remove()},3400);
}
function notify(title,body){
  if(!S.notify)return;
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      var plain=function(){try{new Notification(title,{body:body})}catch(e){}};
      if(navigator.serviceWorker&&navigator.serviceWorker.ready){
        navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body,icon:'icon-192.png',badge:'icon-192.png',vibrate:[220,90,220],tag:'kaaval'})}).catch(plain);
      }else plain();
    }
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([220,90,220])}catch(e){}
}
function fire(o){
  notify(o.title,o.body);
  if(o.kind==='over'&&S.popup){popQ.push(o);if(!popOpen)nextPopup()}
  else toast(o.title+' — '+o.body,o.kind);
}
function nextPopup(){
  var o=popQ.shift(),box=$('#popup');
  if(!o){popOpen=false;box.hidden=true;box.innerHTML='';return}
  popOpen=true;
  box.innerHTML='<div class="pop-bg"><div class="pop '+o.kind+'" role="alertdialog" aria-modal="true" aria-labelledby="pt">'+
    '<div class="pbadge">'+Math.round(o.pct)+'%</div>'+
    '<h2 id="pt"><span class="fx">'+esc(o.title)+'</span></h2><p>'+esc(o.body)+'</p>'+
    '<div class="pnum">'+esc(o.nums)+'</div>'+
    '<button class="btn pri" id="popOk" data-act="pop-ok">'+t('got')+'</button>'+
    '<button class="btn" data-act="pop-raise" data-id="'+esc(o.id||'')+'">'+t('raise')+'</button>'+
    '<button class="btn ghost" data-act="pop-limits">Change limits</button></div></div>';
  box.hidden=false;
  var b=$('#popOk');if(b)b.focus();
}
function checkAlerts(appId){
  if(NATIVE)return;
  var k=todayKey(),a=S.alerts[k]||(S.alerts[k]={}),day=dayOf(k),app=appById(appId),w=S.warn/100;
  var L=app?effLimit(app):null;
  if(app&&L){
    var u=day[app.id]||0;
    if(u>=L&&!a['a100'+app.id]){a['a100'+app.id]=1;a['a80'+app.id]=1;
      fire({kind:'over',id:app.id,title:app.name+' — '+t('lim_title'),body:'You reached today’s '+app.name+' limit.',nums:fs(u)+' / '+fs(L),pct:u/L*100})}
    else if(u>=L*w&&!a['a80'+app.id]){a['a80'+app.id]=1;
      fire({kind:'warn',title:app.name,body:Math.round(u/L*100)+'% of its daily limit used'})}
  }
  if(S.plan){
    var total=sum(day);
    if(total>=S.plan&&!a.t100){a.t100=1;a.t80=1;
      fire({kind:'over',id:'',title:t('lim_title'),body:'You used your whole daily data plan.',nums:fs(total)+' / '+fs(S.plan),pct:total/S.plan*100})}
    else if(total>=S.plan*w&&!a.t80){a.t80=1;
      fire({kind:'warn',title:t('warn_title'),body:fs(S.plan-total)+' left of today’s plan'})}
  }
}
function addUsage(id,mb,quiet){
  var k=todayKey(),d=S.days[k]||(S.days[k]={});
  d[id]=+((d[id]||0)+mb).toFixed(1);

  }

document.addEventListener('visibilitychange',function(){
  document.documentElement.dataset.hidden=document.hidden?'1':'0';
  if(!document.hidden&&curKey!==todayKey()){curKey=todayKey();cal.sel=curKey;render(false)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
});


/* ---------- colour picker (Android WebView has no built-in colour dialog) ---------- */
var pk=null;
function normHex(h){h=String(h||'').trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(h))h=h.split('').map(function(c){return c+c}).join('');return /^[0-9a-f]{6}$/i.test(h)?('#'+h).toUpperCase():null}
function hex2hsv(hex){var h=normHex(hex)||'#000000',r=parseInt(h.substr(1,2),16)/255,g=parseInt(h.substr(3,2),16)/255,b=parseInt(h.substr(5,2),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,H=0;
  if(d){if(mx===r)H=((g-b)/d)%6;else if(mx===g)H=(b-r)/d+2;else H=(r-g)/d+4;H*=60;if(H<0)H+=360}
  return {h:Math.round(H),s:Math.round(mx?d/mx*100:0),v:Math.round(mx*100)}}
function hsv2hex(h,s,v){s/=100;v/=100;var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;
  if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
  var f=function(n){return Math.round((n+m)*255).toString(16).padStart(2,'0')};return ('#'+f(r)+f(g)+f(b)).toUpperCase()}
var PK_LABEL={bg1:'Background',bg2:'Gradient end',card:'Cards and boxes',fg:'Text',accent:'Buttons and accent',okc:'Normal (ring)',warnc:'Warning',overc:'Limit reached'};
function cssHex(v,fb){return normHex(getComputedStyle(document.documentElement).getPropertyValue(v))||fb}
function pkGet(t){var u=S.ui;
  if(t==='accent')return normHex(u.accent)||cssHex('--accent','#2F7BFF');
  if(t==='fg')return normHex(u.fg)||cssHex('--fg','#F4F7FF');
  if(t==='bg1')return u.bg?u.bg.c1:cssHex('--bg','#0A0F1C');
  if(t==='bg2')return u.bg&&u.bg.t==='grad'?u.bg.c2:'#26D0CE';
  if(t==='card')return normHex(u.card)||'#1B2539';
  if(t==='okc')return normHex(u.okc)||cssHex('--ok','#2DD4A7');
  if(t==='warnc')return normHex(u.warnc)||cssHex('--warn','#FBBF24');
  return normHex(u.overc)||cssHex('--over','#FF5D6C')}
function pkSet(t,hex){var u=S.ui;
  if(t==='accent')u.accent=hex;else if(t==='fg')u.fg=hex;else if(t==='card')u.card=hex;
  else if(t==='okc')u.okc=hex;else if(t==='warnc')u.warnc=hex;else if(t==='overc')u.overc=hex;
  else if(t==='bg1'){if(!hex)u.bg=null;else if(u.bg&&u.bg.t==='grad')u.bg.c1=hex;else u.bg={t:'solid',c1:hex}}
  else if(t==='bg2'){if(!hex){if(u.bg&&u.bg.t==='grad')u.bg={t:'solid',c1:u.bg.c1}}else u.bg={t:'grad',c1:u.bg?u.bg.c1:'#1A2980',c2:hex}}}
function pkPaint(sliders,skipHex){
  var h=pk.h,s=pk.s,v=pk.v,hex=hsv2hex(h,s,v);
  $('#pkS').style.background='linear-gradient(90deg,'+hsv2hex(h,0,v)+','+hsv2hex(h,100,v)+')';
  $('#pkV').style.background='linear-gradient(90deg,#000,'+hsv2hex(h,s,100)+')';
  $('#pkPrev').style.background=hex;
  if(!skipHex)$('#pkHex').value=hex;
  if(sliders){$('#pkH').value=h;$('#pkS').value=s;$('#pkV').value=v}
}
function openPicker(t){
  var cur=pkGet(t),q=hex2hsv(cur);
  pk={t:t,h:q.h,s:q.s,v:q.v,hex:cur,snap:JSON.stringify(S.ui)};
  var quick=['#FFFFFF','#000000','#FF3B30','#FF9500','#FFD60A','#34C759','#00C7BE','#0A84FF','#5E5CE6','#BF5AF2','#FF2D92','#8E8E93'];
  var s=$('#sheet');
  s.innerHTML='<div class="sheet-bg" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">'+
   '<h2 id="sh">'+PK_LABEL[t]+'</h2><div class="pkprev" id="pkPrev"></div>'+
   '<div class="lbl">Colour</div><input class="pkr" id="pkH" type="range" min="0" max="360" step="1" value="'+q.h+'" data-in="pk" style="background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)">'+
   '<div class="lbl">Softness</div><input class="pkr" id="pkS" type="range" min="0" max="100" step="1" value="'+q.s+'" data-in="pk">'+
   '<div class="lbl">Brightness</div><input class="pkr" id="pkV" type="range" min="0" max="100" step="1" value="'+q.v+'" data-in="pk">'+
   '<div class="lbl">Quick colours</div><div class="pkq">'+quick.map(function(c){return '<button class="sw" style="--c:'+c+'" data-act="pk-quick" data-c="'+c+'" aria-label="'+c+'"></button>'}).join('')+'</div>'+
   '<div class="field"><label for="pkHex">Colour code</label><input id="pkHex" type="text" maxlength="7" autocapitalize="characters" value="'+cur+'" data-in="pkhex"></div>'+
   '<div class="actions"><button class="btn" data-act="pk-cancel">Cancel</button><button class="btn" data-act="pk-auto">Default</button><button class="btn pri" data-act="pk-done">Done</button></div></div></div>';
  s.hidden=false;pkPaint(false);
}

/* ---------- native (Android) bridge ---------- */
var NATIVE=!!window.KaavalNative;
function hsl2hex(h,sat,l){sat/=100;l/=100;var a=sat*Math.min(l,1-l);var f=function(n){var k=(n+h/30)%12;var c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function hueOf(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h%360}
function hasPerm(){try{return !!window.KaavalNative.hasUsageAccess()}catch(e){return false}}
function nat(fn){try{return !!window.KaavalNative[fn]()}catch(e){return true}}
function permCard(){
  if(!NATIVE)return '';
  var need=[];
  if(!hasPerm())need.push(['native-perm','Usage access','Lets Data Kaaval read how much data each app uses.']);
  if(!nat('hasOverlay'))need.push(['native-overlay','Show over other apps','Lets the limit popup appear on top of YouTube and every other app.']);
  if(!nat('hasBatteryExempt'))need.push(['native-battery','Keep running in background','Choose “Allow” so alerts keep working when the screen is off.']);
  if(!need.length)return '';
  return '<section class="card" style="border-color:var(--accent)"><h2>Finish setup</h2>'+need.map(function(n){
    return '<div class="lrow"><div class="grow"><b>'+n[1]+'</b><div class="sub">'+n[2]+'</div></div><button class="btn pri sm" data-act="'+n[0]+'">Allow</button></div>';
  }).join('')+'</section>';
}
function pushConfig(){
  if(!NATIVE)return;
  try{
    var lim={},names={};
    S.apps.forEach(function(a){names[a.id]=a.name;var L=effLimit(a);if(L)lim[a.id]=L});
    window.KaavalNative.setConfig(JSON.stringify({plan:S.plan,warn:S.warn,popup:S.popup,notify:S.notify,wifi:S.wifi!==false,lang:S.ui.lang,style:S.alertStyle||'pet',intro:S.petIntro||'full',petSound:S.petSound!==false,limits:lim,names:names}));
  }catch(e){}
}
function syncNative(){
  if(!NATIVE)return;
  try{if(!hasPerm())return;pushConfig();window.KaavalNative.requestUsage(S.wifi!==false)}catch(e){}
}
window.onNativeUsage=function(json){
  var d;try{d=JSON.parse(json)}catch(e){return}
  var old={};S.apps.forEach(function(a){old[a.id]=a});
  var totals={};
  Object.keys(d.days).forEach(function(k){var o=d.days[k];for(var id in o)totals[id]=(totals[id]||0)+o[id]});
  var ids=Object.keys(totals).filter(function(id){return id!=='hs'&&totals[id]>=1}).sort(function(a,b){return totals[b]-totals[a]}).slice(0,80);
  Object.keys(old).forEach(function(id){if(id!=='hs'&&effLimit(old[id])&&ids.indexOf(id)<0)ids.push(id)});
  ids.push('hs');
  S.apps=ids.map(function(id){
    var o=old[id],hs=id==='hs';
    return {id:id,name:hs?'Mobile hotspot':(d.names[id]||(o&&o.name)||id),color:hs?'#FF8A3D':(o&&o.color?o.color:hsl2hex(hueOf(id),62,55)),limit:o?o.limit:null,hotspot:hs};
  });
  S.days=d.days;S.sample=false;
  save();
  requestIcons();
  if(document.querySelector('#sheet:not([hidden])'))return;
  if(view==='today')patchToday();
  else if(view==='charts'||view==='cal')render(false);
};
function requestIcons(){
  if(!NATIVE)return;
  var miss=S.apps.filter(function(a){return !a.hotspot&&!ICONS[a.id]&&!iconTried[a.id]}).map(function(a){return a.id});
  if(!miss.length)return;
  miss.forEach(function(id){iconTried[id]=1});
  try{window.KaavalNative.requestIcons(JSON.stringify(miss))}catch(e){}
}
window.onNativeIcons=function(json){
  var d;try{d=JSON.parse(json)}catch(e){return}
  var n=0;for(var id in d){ICONS[id]=d[id];n++}
  if(!n)return;
  try{localStorage.setItem(KEY+'-icons',JSON.stringify(ICONS))}catch(e){}
  var typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(view==='today')patchToday();
  else if(!typing&&document.querySelector('#sheet:not([hidden])')===null)render(false);
};
window.onNativeResume=function(){
  if(view==='today'||view==='settings')render(false);
  syncNative();
};
window.onNativeWarn=function(msg,over){toast(msg,over?'over':'warn')};

/* ---------- boot ---------- */
var curKey=todayKey();
S=load();
if(!S.oneoff)S.oneoff={};S.limMode='more';
if(NATIVE&&S.sample){S.sample=false;S.days={};S.apps=S.apps.filter(function(a){return a.hotspot}).map(function(a){a.limit=null;return a})}
apply();
render(true);
if(NATIVE){syncNative();setInterval(syncNative,60000)}
if(!window.KaavalNative&&'serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
