name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: data-kaaval-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DataKaaval-apk
          path: data-kaaval-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed Play Store bundle (only when the signing secrets are added)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: DataKaaval-playstore-aab
          path: data-kaaval-android/app/build/outputs/bundle/release/app-release.aab
